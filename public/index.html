<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exhibition Hub</title>
<style>
  :root {
    --bg: #191a1d;
    --panel: #222327;
    --border: #35363c;
    --text: #e8e8ea;
    --muted: #9a9ba1;
    --accent: #c96f4a;
    --accent-hover: #d98157;
    --ok: #6fae7c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  main { max-width: 780px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .25rem; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 2rem; font-size: .95rem; }
  form, .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }
  label { display: block; font-size: .8rem; color: var(--muted); margin: .9rem 0 .3rem; text-transform: uppercase; letter-spacing: .05em; }
  label:first-child { margin-top: 0; }
  input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: .6rem .75rem;
    font-size: .95rem;
    font-family: inherit;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 3.2rem; }
  .row { display: flex; gap: 1rem; }
  .row > div { flex: 1; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: .65rem 1.3rem;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 1.1rem;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: wait; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 400; }
  .status { color: var(--muted); font-size: .9rem; margin-top: 1rem; display: none; }
  .status.active { display: block; }
  .status::before { content: "◌ "; color: var(--accent); }
  .question { border-left: 3px solid var(--accent); padding-left: .9rem; }
  .question p { margin: 0 0 .75rem; }
  pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: .85rem;
    line-height: 1.55;
    max-height: 30rem;
    overflow-y: auto;
  }
  .filename { font-family: ui-monospace, monospace; font-size: .9rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: .55rem .75rem; display: inline-block; }
  .copy-row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-top: .5rem; }
  .copy-row button { margin-top: 0; }
  .copied { color: var(--ok); font-size: .85rem; }
  .error { color: #e07070; margin-top: 1rem; font-size: .9rem; white-space: pre-wrap; }
  .hidden { display: none; }
  #login { max-width: 380px; margin: 18vh auto 0; }
</style>
</head>
<body>
<main>
  <div id="login" class="card hidden">
    <label for="password">Passwort</label>
    <input type="password" id="password" autocomplete="current-password">
    <button id="loginBtn">Anmelden</button>
    <div class="error" id="loginError"></div>
  </div>

  <div id="appView" class="hidden">
    <h1>Exhibition <span>Hub</span></h1>
    <p class="sub">Ausstellung nennen → recherchierte Obsidian-Notiz zum Kopieren.</p>

    <form id="mainForm">
      <label for="exhibition">Ausstellung &amp; Museum</label>
      <textarea id="exhibition" placeholder='z.B. "Shifting the Silence im Lenbachhaus München"' required></textarea>
      <div class="row">
        <div>
          <label for="visitDate">Besuchsdatum</label>
          <input type="date" id="visitDate">
        </div>
        <div>
          <label for="number">Laufende Nummer</label>
          <input type="number" id="number" min="1" placeholder="z.B. 27">
        </div>
      </div>
      <label for="comment">Comment (eigene Gedanken)</label>
      <textarea id="comment"></textarea>
      <label for="inspiration">Inspiration for own work</label>
      <textarea id="inspiration"></textarea>
      <button type="submit" id="submitBtn">Notiz erstellen</button>
      <div class="status" id="status">Recherchiere die Ausstellung … das dauert meist 1–2 Minuten.</div>
      <div class="error" id="error"></div>
    </form>

    <div class="card question hidden" id="questionCard">
      <p id="questionText"></p>
      <textarea id="answer" placeholder="Deine Antwort …"></textarea>
      <button id="answerBtn">Antworten</button>
    </div>

    <div class="card hidden" id="resultCard">
      <label>Dateiname</label>
      <div class="copy-row">
        <span class="filename" id="filename"></span>
        <button class="secondary" data-copy="filename">Kopieren</button>
        <span class="copied hidden" id="copiedFilename">✓ kopiert</span>
      </div>
      <label style="margin-top:1.3rem">Notiz (Markdown)</label>
      <pre id="markdown"></pre>
      <div class="copy-row">
        <button data-copy="markdown">Markdown kopieren</button>
        <span class="copied hidden" id="copiedMarkdown">✓ kopiert</span>
        <button class="secondary" id="resetBtn">Neue Notiz</button>
      </div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let history = [];
let currentFilename = '';
let currentMarkdown = '';

function checkSession() {
  // Login entfernt — App direkt anzeigen.
  $('login').classList.add('hidden');
  $('appView').classList.remove('hidden');
}

$('loginBtn').addEventListener('click', async () => {
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: $('password').value }),
  });
  if (res.ok) checkSession();
  else $('loginError').textContent = 'Falsches Passwort';
});
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

function formData() {
  return {
    visitDate: $('visitDate').value,
    number: $('number').value,
    comment: $('comment').value,
    inspiration: $('inspiration').value,
  };
}

function setBusy(busy) {
  $('submitBtn').disabled = busy;
  $('answerBtn').disabled = busy;
  $('status').classList.toggle('active', busy);
}

async function generate(message) {
  setBusy(true);
  $('error').textContent = '';
  $('questionCard').classList.add('hidden');
  $('resultCard').classList.add('hidden');
  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, history, ...formData() }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Unbekannter Fehler');
    history = data.history;
    if (data.type === 'question') {
      $('questionText').textContent = data.question;
      $('answer').value = '';
      $('questionCard').classList.remove('hidden');
    } else {
      currentFilename = data.filename;
      currentMarkdown = data.markdown;
      $('filename').textContent = data.filename;
      $('markdown').textContent = data.markdown;
      $('resultCard').classList.remove('hidden');
      $('resultCard').scrollIntoView({ behavior: 'smooth' });
    }
  } catch (err) {
    $('error').textContent = err.message;
  } finally {
    setBusy(false);
  }
}

$('mainForm').addEventListener('submit', (e) => {
  e.preventDefault();
  history = [];
  generate('Ich war in dieser Ausstellung: ' + $('exhibition').value.trim());
});

$('answerBtn').addEventListener('click', () => {
  const answer = $('answer').value.trim();
  if (answer) generate(answer);
});

document.querySelectorAll('[data-copy]').forEach((btn) => {
  btn.addEventListener('click', async () => {
    const text = btn.dataset.copy === 'filename' ? currentFilename : currentMarkdown;
    await navigator.clipboard.writeText(text);
    const badge = btn.dataset.copy === 'filename' ? $('copiedFilename') : $('copiedMarkdown');
    badge.classList.remove('hidden');
    setTimeout(() => badge.classList.add('hidden'), 2000);
  });
});

$('resetBtn').addEventListener('click', () => {
  history = [];
  $('resultCard').classList.add('hidden');
  $('exhibition').value = '';
  $('comment').value = '';
  $('inspiration').value = '';
  const num = $('number');
  if (num.value) num.value = Number(num.value) + 1;
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

$('visitDate').value = new Date().toISOString().slice(0, 10);
checkSession();
</script>
</body>
</html>
