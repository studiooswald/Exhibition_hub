<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Exhibition Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖼️</text></svg>">
</head>
<body>
  <!-- Login -->
  <div id="login-view" class="login-view hidden">
    <form id="login-form" class="login-card">
      <h1>Exhibition Hub</h1>
      <p>Ausstellungen dokumentieren für Obsidian</p>
      <input type="password" id="password" placeholder="Passwort" autocomplete="current-password" required>
      <button type="submit">Anmelden</button>
      <div id="login-error" class="login-error"></div>
    </form>
  </div>

  <!-- App -->
  <div id="app-view" class="app-view hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>Notizen</h2>
        <button id="new-chat" title="Neue Unterhaltung">+ Neu</button>
      </div>
      <ul id="notes-list" class="notes-list"></ul>
      <div class="sidebar-footer">
        <a id="export-link" href="/api/export" download>Alle Notizen sichern</a>
      </div>
    </aside>

    <main class="chat-area">
      <header class="chat-header">
        <button id="toggle-sidebar" class="icon-btn" title="Verlauf">☰</button>
        <span class="chat-title">Exhibition Hub</span>
      </header>
      <!-- Inhalt kommt aus app.js: Begrüßung oder wiederhergestellter Verlauf -->
      <div id="messages" class="messages"></div>
      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" rows="1" placeholder="z.B. War gestern in ‚Shifting the Silence' im Lenbachhaus …"></textarea>
        <button type="submit" id="send-btn">Senden</button>
      </form>
    </main>
  </div>

  <template id="note-card-template">
    <div class="note-card">
      <div class="note-card-header">
        <span class="note-filename"></span>
        <div class="note-actions">
          <button class="copy-filename-btn" title="Dateinamen kopieren">Name kopieren</button>
          <button class="copy-btn" title="Notiz als Markdown kopieren">Notiz kopieren</button>
        </div>
      </div>
      <div class="note-link"></div>
      <pre class="note-markdown"></pre>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
