# Optional. Der Bot lässt sich genauso gut von Hand deployen – siehe README.
# Dieser Workflow startet nur auf Knopfdruck (Actions → Deploy → Run workflow)
# und braucht dafür die Secrets VPS_HOST, VPS_USER und VPS_SSH_KEY.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dateien auf den Server kopieren
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "."
          target: "/root/exhibition-bot"

      - name: Container neu starten
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /root/exhibition-bot

            # Sicherheitskopie der Datenbank, bevor irgendetwas neu startet
            if [ -f data/exhibition-bot.db ]; then
              mkdir -p data/backups
              cp data/exhibition-bot.db "data/backups/vor-deployment-$(date +%Y%m%d-%H%M%S).db"
            fi

            # Die .env liegt auf dem Server und wird hier bewusst nicht überschrieben
            test -f .env || { echo "Es fehlt die .env auf dem Server."; exit 1; }

            docker compose up -d --build
            docker image prune -f

            for i in $(seq 1 20); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' exhibition-bot)" = "healthy" ] && exit 0
              sleep 5
            done
            echo "Bot wurde nicht gesund – letzte Logzeilen:"
            docker compose logs --tail=50
            exit 1
