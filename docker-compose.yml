services:
  exhibition-bot:
    build: .
    container_name: exhibition-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
      - TZ=${TIMEZONE:-Europe/Berlin}
    # Datenbank und Backups liegen sichtbar im Projektordner (./data) statt in
    # einem anonymen Volume – so sind sie leicht zu sichern und zu kopieren.
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
